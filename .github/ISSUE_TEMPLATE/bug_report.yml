name: Bug report
description: A script failed, or a skill did something wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach PDFs, corpus texts, writing guides or manuscripts.
        Quote a sentence or two, or describe the layout, if an example is needed.
  - type: input
    id: version
    attributes:
      label: corpus-bootstrap version
      description: The `version:` line of SKILL.md
      placeholder: "1.3.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and shell
      placeholder: "Windows 11, PowerShell 5.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python, PyMuPDF and pdftotext
      description: "`py -3 --version` (or `python3 --version`), and whether PyMuPDF and pdftotext are installed"
      placeholder: "Python 3.12.4; PyMuPDF 1.24; pdftotext 24.02 from MiKTeX"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its full output
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: tier_status output
      description: "`py -3 scripts/tier_status.py <field>`, if the field is stamped"
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What you expected
